name: ci
on:
  push:
  pull_request:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md' ':!.github'; then
            echo "::error::Possível segredo no repositório"; exit 1
          fi
      - name: Aplica as migrações D1 em um SQLite local
        run: |
          rm -f teste.db
          for f in migrations/*.sql; do
            echo "Aplicando $f"
            sqlite3 -bail teste.db < "$f" || { echo "::error::Erro na migração $f"; exit 1; }
          done
          sqlite3 teste.db ".tables"
      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"