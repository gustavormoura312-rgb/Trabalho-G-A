      - name: Procura segredos versionados
        run: |
          # Procura só nos arquivos que importam, não no próprio workflow
          if git grep -nE "GOCSPX-|BEGIN PRIVATE KEY" -- migrations/ index.html 2>/dev/null; then
            echo "::error::Possivel segredo no repositório"
            exit 1
          fi
          echo "Nenhum segredo encontrado"