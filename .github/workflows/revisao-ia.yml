name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Monta o prompt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em portugues e em ate 10 itens: segredos expostos,"
            echo "SQL montado por concatenacao em vez de prepare().bind(), e erros de logica."
            echo '```diff'
            git diff "origin/$BASE...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt
      - name: Chama o GitHub Models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --rawfile p prompt.txt '{model:"openai/gpt-4o-mini",messages:[{role:"system",content:"Voce e um revisor de codigo objetivo."},{role:"user",content:$p}]}' > body.json
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d @body.json)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 600 resp.json; exit 1; fi
          jq -r '.choices[0].message.content' resp.json > resposta.md
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file resposta.md