name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Monta o prompt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff "origin/$BASE...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt
      - id: ia
        uses: actions/ai-inference@v1
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.
          model: openai/gpt-4o-mini
          max-tokens: 1500
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESP: ${{ steps.ia.outputs.response-file }}
        run: gh pr comment "$PR" --body-file "$RESP"