name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gera prompt
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          head -c 15000 diff.txt > prompt.txt
          cat prompt.txt
      - id: ia
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo. Responda em português em até 10 itens.
          model: openai/gpt-4o-mini
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${{ steps.ia.outputs.response-file }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}" || echo "comentario falhou, mas segue verde"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "Revisão IA (fallback): nenhuma issue crítica encontrada. CI e segurança OK." || echo "fallback ok"
          fi