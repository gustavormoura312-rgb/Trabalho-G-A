name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Monta o prompt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em portugues e em ate 10 itens: segredos expostos,"
            echo "SQL montado por concatenacao em vez de prepare().bind(), e erros de logica."
            echo '```diff'
            git diff "origin/$BASE...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt
      - id: ia
        uses: actions/ai-inference@v3
        with:
          prompt-file: prompt.txt
          system-prompt: Voce e um revisor de codigo objetivo.
          model: openai/gpt-4o-mini
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESP: ${{ steps.ia.outputs.response-file }}
        run: gh pr comment "$PR" --body-file "$RESP"
