name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g @【entity-github¦canonical_name=GitHub】/【entity-copilot¦canonical_name=Copilot】
      - name: Monta o prompt
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff origin/${{ github.base_ref }}...HEAD | head -c 20000
            echo '```'
          } > prompt.txt
      - id: ia
        uses: actions/ai-inference@v1
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.
          model: openai/gpt-4o-mini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${{ steps.ia.outputs.response-file }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "IA: ${{ steps.ia.outputs.response }}"
          fi