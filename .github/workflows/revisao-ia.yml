name: revisao-ia
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  models: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Monta o prompt
        env:
          BASE: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
            echo "Aponte, em português e em até 10 itens: segredos expostos,"
            echo "SQL montado por concatenação em vez de prepare().bind(), e erros de lógica."
            echo '```diff'
            git diff "origin/$BASE...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt
      - id: ia
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: prompt.txt
          token: ${{ secrets.COPILOT_PAT }}
          system-prompt: Você é um revisor de código objetivo.
          model: openai/gpt-4o-mini
          max-tokens: 1500
      - name: Reserva via API (se a acao falhar)
        if: steps.ia.outcome == 'failure'
        env:
          PAT: ${{ secrets.COPILOT_PAT }}
          GHT: ${{ github.token }}
        run: |
          jq -n --rawfile p prompt.txt '{model:"openai/gpt-4o-mini",messages:[{role:"system",content:"Você é um revisor de código objetivo."},{role:"user",content:$p}],max_tokens:1500}' > req.json
          for T in "$PAT" "$GHT"; do
            code=$(curl -sS -o resp.json -w "%{http_code}" https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d @req.json)
            echo "DIAG HTTP $code"
            if [ "$code" = "200" ]; then jq -r '.choices[0].message.content' resp.json > resposta.md; exit 0; fi
            echo "DIAG BODY: $(head -c 300 resp.json)"
          done
          exit 1
      - name: Comenta no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RESP: ${{ steps.ia.outputs.response-file }}
        run: |
          if [ -s resposta.md ]; then F=resposta.md; else F="$RESP"; fi
          gh pr comment "$PR" --body-file "$F"